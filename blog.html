    <title>Blog - Studio Genki</title>

    <style>
      /* ---- LISTING VIEW ---- */
      .listing h2 {
        font-family: var(--font-merriweather, 'Merriweather', serif);
        font-weight: 400;
        font-size: 40px;
        line-height: 1.2;
        color: #FFFFFF;
        margin: 0 0 48px 0;
      }

      .post-card {
        margin-bottom: 48px;
        padding-bottom: 48px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .post-card:last-child {
        border-bottom: none;
      }

      .post-meta {
        font-family: var(--font-merriweather-sans, 'Merriweather Sans', sans-serif);
        font-weight: 300;
        font-size: 14px;
        color: #B9B9B9;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
      }

      .meta-separator {
        margin: 0 8px;
        opacity: 0.5;
      }

      .post-title {
        font-family: var(--font-merriweather, 'Merriweather', serif);
        font-weight: 400;
        font-size: 28px;
        color: #FFFFFF;
        margin-bottom: 12px;
      }

      .post-title a {
        color: #FFFFFF;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }

      .post-title a:hover {
        opacity: 0.7;
      }

      .post-excerpt {
        font-family: var(--font-merriweather-sans, 'Merriweather Sans', sans-serif);
        font-weight: 300;
        font-size: 18px;
        line-height: 1.6;
        color: #B9B9B9;
        max-width: 800px;
      }

      @media (max-width: 1024px) {
        .listing h2 { font-size: 36px; }
        .post-title { font-size: 24px; }
      }

      @media (max-width: 768px) {
        .listing h2 { font-size: 32px; }
        .post-title { font-size: 22px; }
        .post-excerpt { font-size: 16px; }
      }
    </style>
