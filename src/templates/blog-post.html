<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="view-transition" content="same-origin" />
    <meta name="description" content="{{DESCRIPTION}}" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    
    <title>{{TITLE}} - Studio Genki</title>

    <script>
      (function() {
        var savedTheme = localStorage.getItem('sg_theme');
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = savedTheme ? savedTheme : (systemDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <style>
      /* ---- SINGLE POST VIEW ---- */
      .back-link {
        display: inline-block;
        font-family: var(--font-merriweather-sans, 'Merriweather Sans', sans-serif);
        font-weight: 300;
        font-size: 16px;
        color: var(--color-text-muted, #B9B9B9);
        text-decoration: none;
        margin-bottom: 48px;
        transition: color 0.2s ease;
      }

      .back-link:hover {
        color: var(--color-text, #FFFFFF);
      }

      .single-post .post-meta-info {
        font-family: var(--font-merriweather-sans, 'Merriweather Sans', sans-serif);
        font-weight: 300;
        font-size: 14px;
        color: var(--color-text-muted, #B9B9B9);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 16px;
        transition: color 0.3s ease;
      }

      .meta-separator {
        margin: 0 8px;
        opacity: 0.5;
      }

      .single-post h1 {
        font-family: var(--font-merriweather, 'Merriweather', serif);
        font-weight: 400;
        font-size: 40px;
        line-height: 1.2;
        color: var(--color-text, #FFFFFF);
        margin: 0 0 40px 0;
        transition: color 0.3s ease;
      }

      /* Rendered markdown content */
      .prose {
        max-width: 800px;
      }

      .prose p {
        font-family: var(--font-merriweather-sans, 'Merriweather Sans', sans-serif);
        font-weight: 300;
        font-size: 20px;
        line-height: 1.6;
        color: var(--color-text-muted, #B9B9B9);
        margin: 0 0 24px 0;
        transition: color 0.3s ease;
      }

      .prose h2 {
        font-family: var(--font-merriweather, 'Merriweather', serif);
        font-weight: 400;
        font-size: 28px;
        color: var(--color-text, #FFFFFF);
        margin: 48px 0 16px 0;
        transition: color 0.3s ease;
      }

      .prose h3 {
        font-family: var(--font-merriweather, 'Merriweather', serif);
        font-weight: 400;
        font-size: 22px;
        color: var(--color-text, #FFFFFF);
        margin: 36px 0 12px 0;
        transition: color 0.3s ease;
      }

      .prose ul, .prose ol {
        font-family: var(--font-merriweather-sans, 'Merriweather Sans', sans-serif);
        font-weight: 300;
        font-size: 20px;
        line-height: 1.6;
        color: var(--color-text-muted, #B9B9B9);
        padding-left: 24px;
        margin: 0 0 24px 0;
        transition: color 0.3s ease;
      }

      .prose li {
        margin-bottom: 12px;
      }

      .prose strong {
        color: var(--color-text, #FFFFFF);
        font-weight: 400;
        transition: color 0.3s ease;
      }

      .prose a {
        color: var(--color-text, #FFFFFF);
        text-decoration: underline;
        text-underline-offset: 4px;
        transition: color 0.3s ease;
      }

      .prose a:hover {
        opacity: 0.8;
      }

      .prose blockquote {
        margin: 32px 0;
        padding-left: 24px;
        border-left: 2px solid var(--color-text, #FFFFFF);
        font-family: var(--font-merriweather, 'Merriweather', serif);
        font-size: 24px;
        font-style: italic;
        color: var(--color-text, #FFFFFF);
        line-height: 1.5;
        transition: color 0.3s ease, border-color 0.3s ease;
      }

      .prose code {
        font-family: monospace;
        background: rgba(255, 255, 255, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 16px;
      }

      :root[data-theme="light"] .prose code {
        background: rgba(0, 0, 0, 0.06);
      }

      .prose hr {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        margin: 48px 0;
      }

      :root[data-theme="light"] .prose hr {
        border-top: 1px solid rgba(0, 0, 0, 0.08);
      }

      @media (max-width: 1024px) {
        .single-post h1 { font-size: 36px; }
        .prose h2 { font-size: 24px; }
        .prose h3 { font-size: 20px; }
      }

      @media (max-width: 768px) {
        .single-post h1 { font-size: 30px; }
        .prose p, .prose ul, .prose ol { font-size: 18px; }
        .prose blockquote { font-size: 20px; padding-left: 16px; }
      }
    </style>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">

  <!-- Open Graph / Twitter -->
  <meta property="og:title" content="{{TITLE}} - Studio Genki">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="https://studiogenki.in/blog/{{SLUG}}.html">
  <meta property="og:type" content="article">
  <meta property="og:image" content="https://studiogenki.in/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}} - Studio Genki">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="https://studiogenki.in/og-image.jpg">

</head>
  <body>
    <theme-toggle></theme-toggle>
    <!-- Use a subtle dark background for reading long text -->
    
    <div class="page-overlay">
      <div class="container header-container">
        <site-header></site-header>
      </div>
      
      <div class="container page-content">
        <div class="single-post">
          <a href="/blog.html" class="back-link">← Back to Blog</a>
          <div class="post-meta-info">
            {{META_INFO}}
          </div>
          <h1>{{TITLE}}</h1>
          <div class="prose">
            {{POST_CONTENT}}
          </div>
        </div>
      </div>

      <div class="container footer-container">
        <site-footer></site-footer>
      </div>
    </div>
    
    <script type="module">
      import '/src/styles/main.css';
      import '/src/components/theme-toggle.js';
      import '/src/components/site-header.js';
      import '/src/components/site-footer.js';
      import '/src/components/static-background.js';
    </script>
  </body>
</html>
